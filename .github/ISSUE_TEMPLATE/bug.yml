name: Bug report
description: Report reproducible incorrect Alfred behavior without private workspace data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Remove credentials, private prompts, repository paths, task content, and runtime state before
        submitting. Use a private channel for security issues.
  - type: input
    id: version
    attributes:
      label: Alfred version or revision
      placeholder: 0.1.0.dev0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: python
    attributes:
      label: Python version
      options:
        - "3.11"
        - "3.12"
        - "3.13"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include sanitized output and the exact command where useful.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use a temporary repository and generic names whenever possible.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets and private workspace information.
          required: true
        - label: This is not a vulnerability report.
          required: true
